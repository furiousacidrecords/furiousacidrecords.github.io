<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 | Missing Passage</title>
  <style>
    :root{
      --bg:#07070a;
      --text:#f3f4f6;
      --brand1:#ff2bd6;
      --brand2:#6d28ff;
      --line:rgba(255,255,255,.10);
    }
    body{
      margin:0; font-family: ui-sans-serif, system-ui, sans-serif;
      color:var(--text); background: var(--bg);
      height:100vh; display:flex; align-items:center; justify-content:center; text-align:center;
    }
    .card{
      border:1px solid var(--line); padding:40px; border-radius:18px;
      background: rgba(255,255,255,.03);
    }
    h1{ font-size: 80px; margin:0; background: linear-gradient(135deg, var(--brand1), var(--brand2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p{ color: rgba(243,244,246,.7); margin-bottom: 30px; }
    .btn{
      padding:12px 24px; border-radius:12px; background: linear-gradient(135deg, var(--brand1), var(--brand2));
      color:white; text-decoration:none; font-weight:bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>This passage is hidden or does not exist.</p>
    <a href="index.html" class="btn">Return to Hub</a>
  </div>
</body>
</html>
