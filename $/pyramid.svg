<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 390" role="img" aria-labelledby="title desc"><title id="title">The FuriousAcid pyramid</title><desc id="desc">Membership is the foundation: ongoing questions for five dollars a month. A single question is three dollars. A custom report at the top is fifty dollars.</desc><defs><linearGradient id="base" x2="1" y2="1"><stop stop-color="#e5ff96"/><stop offset="1" stop-color="#b5e944"/></linearGradient><linearGradient id="mid" x2="1" y2="1"><stop stop-color="#d1b6ff"/><stop offset="1" stop-color="#aa86de"/></linearGradient></defs><path d="M270 18 205 130H335Z" fill="#f0ecdf"/><path d="M199 140H341L405 250H135Z" fill="url(#mid)"/><path d="M129 260H411L475 370H65Z" fill="url(#base)"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#171b10"><text x="270" y="101" font-size="11" font-weight="700" letter-spacing="1.5">REPORT</text><text x="270" y="122" font-size="20" font-weight="700">$50</text><text x="270" y="188" font-size="14" font-weight="700" letter-spacing="2">ONE QUESTION</text><text x="270" y="226" font-size="31" font-weight="700">$3</text><text x="270" y="302" font-size="15" font-weight="700" letter-spacing="2">MEMBERSHIP</text><text x="270" y="343" font-size="34" font-weight="700">$5<tspan font-size="17" font-weight="400"> / month</tspan></text></g></svg>