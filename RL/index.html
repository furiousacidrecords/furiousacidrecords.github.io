<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rabbit Chemistry Lab | Furious Acid</title><link rel="stylesheet" href="lab.css">
<style>.lab-downloads{margin-right:auto;align-self:center;padding:4px 8px;font-size:12px;line-height:1.4}.lab-downloads a{color:#d6c7ff}nav{flex-basis:auto;min-height:32px}
#stockroom-link{display:inline-flex;align-items:center;padding:4px 8px;color:#e3d8f1;font-size:13px;white-space:nowrap}
@media(max-width:620px){nav{flex-wrap:wrap;row-gap:0}.lab-downloads{flex-basis:100%;text-align:center}#stockroom-link{margin-right:auto}}
#lab-stage{position:relative;flex:1;min-height:0}
#viewport{position:absolute;inset:0}
#lab-loader{position:absolute;inset:0;display:grid;place-items:center;background:#08081b;pointer-events:none}
#lab-loader{container-type:size}
.relay-frame{position:relative;overflow:hidden;width:min(88%,440px);width:min(88cqw,82cqh,440px);aspect-ratio:309/308}
.relay-frame img{position:absolute;left:0;top:0;width:1600%;height:100%;max-width:none;will-change:transform;animation:relay-frames 2.24s steps(16,end) infinite}
@keyframes relay-frames{from{transform:translate3d(0,0,0)}to{transform:translate3d(-100%,0,0)}}
#lab-stage #status{top:auto;bottom:1%;z-index:1;background:#161421;color:white;border-radius:.3em}
</style><link rel="stylesheet" href="/RL/reference.css"></head>
<body>

<div id="status" role="status">Opening Rabbit Chemistry…</div>
</div>
