name: Verify public Rabbit Chemistry APK
on: [push]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Download and verify public APK
        run: |
          curl -fsSL --retry 3 https://furiousacid.com/downloads/Rabbit_Chemistry.apk -o lab.apk
          echo 'eb2a6b0dfad95713ccf7b5832535d3931560cdb54b9746273d7141679f694dd7  lab.apk' | sha256sum -c
          sudo chmod 666 /dev/kvm
          python -m pip install Pillow
          cat > verify.py <<'PYTHON'
          import io, time, base64, subprocess, os
          from PIL import Image, ImageChops, ImageStat
          def adb(*args):
              return subprocess.check_output(['adb', *map(str,args)])
          def frame():
              raw=adb('exec-out','screencap','-p')
              im=Image.open(io.BytesIO(raw)).convert('RGB')
              w,h=im.size
              b=next((i for i in range(h) if max(abs(a-v) for a,v in zip(im.getpixel((1,i)),(33,29,48)))<6),round(h*.91))
              dw=round(min(w,b*4/3));dh=round(dw*.75);x=(w-dw)//2;y=(b-dh)//2
              return im,im.crop((x,y,x+dw,y+dh)).resize((1024,768)),(x,y,dw,dh)
          def tap(x,y):
              a,b,w,h=g
              adb('shell','input','tap',round(a+x*w/1024),round(b+y*h/768))
          refs=[('blank', (120, 104, 702, 430), ''), ('menu', (106, 144, 299, 363), ''), ('lesson', (318, 188, 778, 575), '')]
          
          for state,box,encoded in refs:
              target=Image.open(io.BytesIO(base64.b64decode(encoded))).convert('RGB')
              start=time.monotonic()
              while time.monotonic()-start<460:
                  im,screen,g=frame()
                  score=sum(ImageStat.Stat(ImageChops.difference(screen.crop(box).resize((64,48)),target)).mean)/3
                  print(state,round(time.monotonic()-start),round(score,2),flush=True)
                  im.save('last.png')
                  if score<12: break
                  time.sleep(3)
              else: raise RuntimeError(state)
              im.save(state+'.png')
              if state=='blank':tap(122,136)
              if state=='menu':
                  adb('shell','input','keyevent','111')
                  time.sleep(2)
                  tap(184,335)
                  time.sleep(4)
                  tap(191,360)
                  time.sleep(.12)
                  tap(191,360)
          PYTHON
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb shell wm size 540x900
            adb shell wm density 240
            adb install lab.apk
            adb shell am start -n com.furiousacid.rabbitchemistry/.LabActivity
            python verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-screens
          path: '*.png'
