name: Install iodine story media

on:
  push:
    paths:
      - "purple/assets/iodine-pre-sublimation-app.mp4.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode video and attach story script
        shell: python
        run: |
          from pathlib import Path
          import base64

          encoded = Path("purple/assets/iodine-pre-sublimation-app.mp4.b64")
          output = Path("purple/assets/iodine-pre-sublimation-app.mp4")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(base64.b64decode(encoded.read_text(encoding="utf-8")))
          encoded.unlink()

          index = Path("purple/index.html")
          html = index.read_text(encoding="utf-8")
          tag = '<script src="./iodine-story.js" defer></script>'
          if tag not in html:
              if "</body>" in html:
                  html = html.replace("</body>", f"  {tag}\n</body>", 1)
              else:
                  html += f"\n{tag}\n"
              index.write_text(html, encoding="utf-8")

      - name: Commit installed media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add purple/index.html purple/iodine-story.js purple/assets/iodine-pre-sublimation-app.mp4
          git rm --ignore-unmatch purple/assets/iodine-pre-sublimation-app.mp4.b64
          git commit -m "Install exact reaction video before iodine sublimation" || exit 0
          git push
