name: Install iodine story media

on:
  push:
    paths:
      - "purple/install-iodine-story.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact uploaded video
        run: |
          mkdir -p purple/assets
          curl -L --fail --retry 3 \
            "https://at.adobe.com/fAV8slBG4vsfv2vv" \
            -o purple/assets/iodine-pre-sublimation-app.mp4
          test -s purple/assets/iodine-pre-sublimation-app.mp4

      - name: Attach story script to the app
        shell: python
        run: |
          from pathlib import Path

          index = Path("purple/index.html")
          html = index.read_text(encoding="utf-8")
          tag = '<script src="./iodine-story.js" defer></script>'
          if tag not in html:
              if "</body>" in html:
                  html = html.replace("</body>", f"  {tag}\n</body>", 1)
              else:
                  html += f"\n{tag}\n"
              index.write_text(html, encoding="utf-8")

          Path("purple/install-iodine-story.trigger").unlink(missing_ok=True)

      - name: Commit installed media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add purple/index.html purple/iodine-story.js purple/assets/iodine-pre-sublimation-app.mp4
          git rm --ignore-unmatch purple/install-iodine-story.trigger
          git commit -m "Install exact reaction video before iodine sublimation" || exit 0
          git push
