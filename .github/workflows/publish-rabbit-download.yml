name: Publish verified Rabbit Chemistry download
on:
  push:
    paths:
      - '.github/workflows/publish-rabbit-download.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and verify Windows file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          tempdir="$(mktemp -d)"
          for part in 0 1 2; do
            curl --fail --location --retry 3 --max-time 180 "https://rabbit-chemistry-windows-download.skittlez2901.chatgpt.site/windows-$part.bin" -o "$tempdir/$part.bin"
          done
          cat "$tempdir/0.bin" "$tempdir/1.bin" "$tempdir/2.bin" > downloads/Rabbit_Chemistry.exe
          echo "ef8cbe432bbd83089949604e28f958b0bfcd8371fac31e25e35ea03e8efe4da8  downloads/Rabbit_Chemistry.exe" | sha256sum -c -
          test "$(wc -c < downloads/Rabbit_Chemistry.exe)" -eq 51318530
      - name: Publish verified file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Rabbit_Chemistry.exe
          git diff --cached --quiet && exit 0
          git commit -m "Add metadata-cleaned Rabbit Chemistry Windows download"
          git pull --rebase origin main
          git push origin HEAD:main
