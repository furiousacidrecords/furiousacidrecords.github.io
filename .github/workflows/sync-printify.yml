name: Sync Printify merch

on:
  push:
    paths:
      - ".github/workflows/sync-printify.yml"
      - "scripts/install-purple-progress.mjs"
      - "scripts/install-reaction-calculator.mjs"
      - "purple-progress.html"
      - "purple-progress.json"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Purple chemistry components
        run: |
          node scripts/install-purple-progress.mjs
          node scripts/install-reaction-calculator.mjs

      - name: Refresh Printify products
        run: node scripts/sync-printify.mjs

      - name: Publish site updates
        run: |
          if git diff --quiet; then
            echo "Site data and chemistry components are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html merch-data.json calc/index.html calc/app.js calc/styles.css
          git commit -m "Install Purple chemistry components"
          git push
