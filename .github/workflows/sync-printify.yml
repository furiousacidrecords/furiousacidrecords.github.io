name: One-time Merch link update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update only the top Merch link
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          old = '        <a href="#merch">Merch</a>'
          new = '        <a href="https://furiousacid.printify.me/products" target="_blank" rel="noopener noreferrer">Merch</a>'
          text = path.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one unchanged top Merch link")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Restore normal workflow and publish link change
        run: |
          git show HEAD^:.github/workflows/sync-printify.yml > .github/workflows/sync-printify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/sync-printify.yml
          git commit -m "Link top Merch button to Printify products"
          git push
