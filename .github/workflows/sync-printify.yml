name: Sync Printify merch

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh Printify products
        run: node scripts/sync-printify.mjs

      - name: Publish changed merch data
        run: |
          if git diff --quiet -- merch-data.json; then
            echo "Printify products are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merch-data.json
          git commit -m "Sync Printify merch"
          git push
