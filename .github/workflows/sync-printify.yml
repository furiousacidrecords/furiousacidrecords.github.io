name: Sync Printify merch

on:
  push:
    paths:
      - ".github/workflows/sync-printify.yml"
      - "scripts/sync-printify.mjs"
      - "merch-data.json"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh Printify products
        run: node scripts/sync-printify.mjs

      - name: Publish merch updates
        run: |
          if git diff --quiet; then
            echo "Merch data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merch-data.json
          git commit -m "Refresh Printify merch"
          git push
