name: Install Purple startup look

on:
  push:
    paths:
      - "purple/install-purple-startup-look.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the edited counter background
        run: |
          mkdir -p purple/assets
          curl -L --fail --retry 3 \
            "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:824873b2-7768-449c-8409-37b70bb4d7d6" \
            -o purple/assets/purple-startup-counter.png
          python - <<'PY'
          from pathlib import Path
          data = Path("purple/assets/purple-startup-counter.png").read_bytes()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Downloaded startup background is not a PNG")
          PY

      - name: Attach the startup UI to Purple Chemistry
        shell: python
        run: |
          from pathlib import Path

          index = Path("purple/index.html")
          html = index.read_text(encoding="utf-8")
          tag = '<script src="./startup-ui.js" defer></script>'
          if tag not in html:
              if "</body>" in html:
                  html = html.replace("</body>", f"  {tag}\n</body>", 1)
              else:
                  html += f"\n{tag}\n"
              index.write_text(html, encoding="utf-8")

          Path("purple/install-purple-startup-look.trigger").unlink(missing_ok=True)

      - name: Commit the installed startup look
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add purple/index.html purple/startup-ui.js purple/assets/purple-startup-counter.png
          git rm --ignore-unmatch purple/install-purple-startup-look.trigger
          git commit -m "Start Purple Chemistry with a compact parts panel and illustrated counter" || exit 0
          git push
