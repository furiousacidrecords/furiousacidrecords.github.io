name: Install lab principles
on:
  push:
    paths:
      - .github/workflows/install-lab-principles.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add principles module
        shell: bash
        env:
          MODULE_GZIP_BASE64: >-
            
        run: |
          printf '%s' "$MODULE_GZIP_BASE64" | base64 --decode | gzip --decompress > purple/lab-principles.js
          python - <<'PY'
          from pathlib import Path
          path = Path("purple/index.html")
          text = path.read_text(encoding="utf-8")
          tag = '    <script src="./lab-principles.js" defer></script>'
          if tag not in text:
              if "</body>" not in text:
                  raise SystemExit("purple/index.html has no </body> marker")
              text = text.replace("</body>", f"{tag}\n  </body>", 1)
              path.write_text(text, encoding="utf-8")
          workflow = Path(".github/workflows/install-lab-principles.yml")
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit update
        run: |
          git config user.name "Furious Acid automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add drying, vacuum and density principles"
          git push
