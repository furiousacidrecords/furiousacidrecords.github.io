name: Build Simon (C# and Perl)
on:
  push:
    branches: [main]
    paths:
      - 'SimonSource/**'
      - '.github/workflows/simon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out existing website
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate original audio with Perl
        run: perl SimonSource/make_sounds.pl SimonSource/wwwroot/sounds
      - name: Compile actual C# game to WebAssembly
        run: dotnet publish SimonSource/Simon.csproj --configuration Release --output "$RUNNER_TEMP/simon-published"
      - name: Copy only the Simon app into the existing site
        run: |
          rm -rf Simon
          mkdir -p Simon
          cp -R "$RUNNER_TEMP/simon-published/wwwroot/." Simon/
          touch .nojekyll
      - name: Commit published game without replacing other pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Simon .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish compiled Simon C# WebAssembly game"
            git push origin HEAD:main
          fi
