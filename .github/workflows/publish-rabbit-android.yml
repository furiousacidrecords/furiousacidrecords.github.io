name: Publish Rabbit Chemistry APK
on:
  push:
    paths:
      - .github/workflows/publish-rabbit-android.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish signed APK
        shell: bash
        run: |
          set -euo pipefail
          dest=downloads/Rabbit_Chemistry.apk
          python - <<'PY'
          import json, base64, zlib, hashlib
          from pathlib import Path
          path = Path("downloads/Rabbit_Chemistry.apk")
          patch = json.loads('{"from":"e0f29db3a0d02d2f086d91c5f6d9489722b2c7d6385fc80da38595c70181d239","to":"eb2a6b0dfad95713ccf7b5832535d3931560cdb54b9746273d7141679f694dd7","ops":["",[1024,54600],"eNoL8GZmYYACRYai41MtfJgYGECYj4GDoSi1OL+0KDm1WC+xqDjZ9CYLA0gxAObZCkQ=",[55676,588],"eNoL8GZmYQACDiBWZOD9cdC6/ToDw9kZzAzCQJHE4uLUkmL9pPyK1JTyzLxUvaxiAAU1DTg=",[56313,55175],"eNoL8GZmYYACRYZ8HvN4pxOiDCAsysDJkFhcnFpSrJ+UX5GaUp6Zl6pXnlica3qTlQGsBwBpGg21",[111548,1427522],"eNoL8GZmYQACDiBWZIj8fKBz1XImhjnPeRhkgSKJxcWpJcX6SUX55cWpRWnFekn5Fakp5Zl5qXpZxQC/JxH9",[1539129,173994],"eNoL8GZmYYACRYaLE7qYvyj+YQJhIQZOhsTi4tSSYv2U1OLskvwCvarMAtObrAxgDQCifQ9H",[1713180,50078196],"",[51791851,516],"",[51796543,6784],"eNoL8GZmYQACDiBWZDAS3yyeosLAYJzOwCADFEksLk4tKdbPyUxOzStOLdb3cQ/w0TXSM9QrqSgBAB5NDN8=",[51803385,9316],"eNoL8GZmYQACDiBWZPgWsb/fWjyBMbZSnFkUKJJYXJxaUqxfnJlbmpNYkl+kV5CYnA0AFEQNjw==",[51812752,23074619],"eNoL8GZmEWFgYOBg6G0qiRVbOl1okigDg4IuAwM3UDQ5J7G4OLVYLyW1AgCoSQlf",[74887412,5522],""]}')
          old = path.read_bytes()
          digest = lambda b: hashlib.sha256(b).hexdigest()
          if digest(old) != patch["to"]:
              assert digest(old) == patch["from"]
              new = b"".join(old[o[0]:o[0]+o[1]] if isinstance(o,list) else zlib.decompress(base64.b64decode(o)) for o in patch["ops"])
              assert digest(new) == patch["to"]
              path.write_bytes(new)
          PY
          git add -- "$dest"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Open Rabbit Chemistry to a blank lab"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
