name: Publish updated Rabbit Chemistry downloads
on:
  push:
    paths:
      - .github/workflows/publish-rabbit-android.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/package-rabbit-downloads.py
      - name: Publish both packages together
        run: |
          git add downloads/Rabbit_Chemistry.apk downloads/Rabbit-Chemistry-Windows.zip
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Publish complete Windows stockroom and signed Android v7"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
