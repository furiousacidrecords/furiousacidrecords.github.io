name: Build Rabbit Chemistry browser lab
on:
  push:
    branches: [main]
    paths:
      - downloads/Rabbit_Chemistry.apk
      - .github/workflows/build-rabbit-web-lab.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the bundled web application
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          names = ['index.html', 'lab.css', 'lab.js', 'boxedwine.js', 'boxedwine.wasm', 'browserfs.boxedwine.js', 'desktop.zip', 'simulator.pack', 'licenses/Components.txt', 'licenses/GPL-2.txt', 'licenses/LGPL-2.1.txt']
          with ZipFile('downloads/Rabbit_Chemistry.apk') as apk:
              for name in names:
                  path = Path('RL') / name
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(apk.read('assets/' + name))
          page = Path('RL/index.html')
          page.write_text(page.read_text().replace('<title>Rabbit Chemistry</title>', '<title>Rabbit Chemistry Lab | Furious Acid</title>').replace('id="keyboard"', 'hidden id="keyboard"').replace('Opening Rabbit Chemistry…', 'Loading Rabbit Chemistry. The first visit downloads the lab files.'))
          PY
          git add RL/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m 'Build playable browser lab from the Rabbit Chemistry release'
          git pull --rebase origin main
          git push origin HEAD:main
