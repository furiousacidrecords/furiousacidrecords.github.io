<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Explore Furious Acid. Rotate the glass cube to discover books, merch, the Lab, games, apps, updates, and the Purple Rabbit chatbot.">
  <title>Furious Acid</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/cube.css">
</head>
<body>
  <header class="header">
    <a class="wordmark" href="/" aria-label="Furious Acid home">FURIOUS<span>ACID</span></a>
    <a class="updates-link" href="/me">Updates <span aria-hidden="true">/ 01</span></a>
  </header>
  <main>
    <div class="intro"><p class="eyebrow">THE FURIOUS ACID UNIVERSE</p><h1>Pick a plane.</h1><p class="hint" id="cube-help">Drag to rotate. Tap a face to explore.</p></div>
    <div class="stage" id="stage" role="group" aria-label="Interactive six-sided navigation cube" aria-describedby="cube-help" tabindex="0">
      <div class="cube" id="cube">
        <div class="face front" data-plane="updates"><button type="button" data-select="updates"><span class="face-number">01 / FURIOUS ACID</span><span class="face-title">Updates</span><span class="face-note">What happened. What’s next.</span></button></div>
        <div class="face right" data-plane="books"><button type="button" data-select="books"><span class="face-number">02 / FURIOUS ACID</span><span class="face-title">Books</span><span class="face-note">Open a hidden passage.</span></button></div>
        <div class="face back" data-plane="merch"><button type="button" data-select="merch"><span class="face-number">03 / FURIOUS ACID</span><span class="face-title">Merch</span><span class="face-note">Take a piece with you.</span></button></div>
        <div class="face left" data-plane="lab"><button type="button" data-select="lab"><span class="face-number">04 / FURIOUS ACID</span><span class="face-title">Lab<span class="alpha">ALPHA</span></span><span class="face-note">Step up to the bench.</span></button></div>
        <div class="face top" data-plane="games"><button type="button" data-select="games"><span class="face-number">05 / FURIOUS ACID</span><span class="face-title">Games</span><span class="face-note">Play in our world.</span></button></div>
        <div class="face bottom" data-plane="apps"><button type="button" data-select="apps"><span class="face-number">06 / FURIOUS ACID</span><span class="face-title">Apps<span class="chat-label">+ Chatbot</span></span><span class="face-note">Ask. Calculate. Create.</span></button></div>
      </div>
    </div>
    <div class="cube-controls"><span class="motion-label" id="motion-label">SLOW ROTATION</span><button type="button" id="motion" aria-pressed="false">Pause rotation</button><button type="button" id="reset">Reset view</button></div>
    <nav class="planes" aria-label="Choose a cube face">
      <button type="button" data-select="updates">Updates</button><button type="button" data-select="books">Books</button><button type="button" data-select="merch">Merch</button><button type="button" data-select="lab">Lab Alpha</button><button type="button" data-select="games">Games</button><button type="button" data-select="apps">Apps</button><button type="button" data-select="apps">Chatbot</button>
    </nav>
    <section class="destination" id="destination" aria-labelledby="destination-title" hidden>
      <div><p class="eyebrow" id="destination-number"></p><h2 id="destination-title"></h2><p id="destination-description"></p></div><div class="destination-links" id="destination-links"></div>
    </section>
    <noscript><nav class="fallback" aria-label="Furious Acid sections"><a href="/me">Updates</a><a href="/catalog.html#books">Books</a><a href="/merch/">Merch</a><a href="/lab/">Lab Alpha</a><a href="/roll/">Games</a><a href="/calc/">Apps</a><a href="/rabbit/">Chatbot</a></nav></noscript>
  </main>
  <footer><span>© 2026 FURIOUS ACID</span><a href="/catalog.html">Browse the catalog</a><a href="https://acid-chat-hub.lovable.app/forum">Forum</a></footer>
  <script src="/cube.js" defer></script>
</body>
</html>
