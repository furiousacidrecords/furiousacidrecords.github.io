<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Furious Acid</title>
  <style>html,body{margin:0;background:#f3f2f5;font-family:system-ui,sans-serif}p{padding:24px;text-align:center}</style>
</head>
<body>
  <p>Loading Furious Acid…</p>
  <script>
    fetch('home-original.html?v=20260805-2', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('Homepage unavailable');
        return response.text();
      })
      .then(function (html) {
        html = html.replace(/<iframe\b[^>]*class=["'][^"']*\bpurple-progress-frame\b[^"']*["'][\s\S]*?<\/iframe>/gi, '');
        html = html.replace(/<a\b[^>]*class=["'][^"']*\blab-simulator-cta\b[^"']*["'][^>]*>[\s\S]*?<\/a>/gi, '');
        html = html.replace(/<a\b[^>]*href=["']\/purple(?:\/manual)?\/?["'][^>]*>[\s\S]*?<\/a>/gi, '');
        html = html.replace(/<p class=["']update-copy["'][^>]*>[\s\S]*?<\/p>/i, '<p class="update-copy">Books, merch, community links, and current Furious Acid releases.</p>');

        var mobileCatalogStyle = `<style id="mobile-catalog-grid-style">
          @media (max-width: 900px) {
            html, body {
              max-width: 100% !important;
              overflow-x: hidden !important;
            }
            .shop-panel,
            .shop-row {
              overflow: visible !important;
            }
            .shop-panel .book-grid,
            .shop-panel .merch-grid {
              display: grid !important;
              grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
              grid-auto-flow: row !important;
              grid-auto-columns: minmax(0, 1fr) !important;
              gap: 8px !important;
              width: 100% !important;
              max-width: 100% !important;
              overflow: visible !important;
              overflow-x: visible !important;
              padding: 0 !important;
              scroll-snap-type: none !important;
              -webkit-overflow-scrolling: auto !important;
            }
            .shop-panel .book-grid > *,
            .shop-panel .merch-grid > *,
            .shop-panel .merch-card,
            .shop-panel .product-card {
              width: 100% !important;
              min-width: 0 !important;
              max-width: 100% !important;
              flex: none !important;
              margin: 0 !important;
            }
            .shop-panel .product-image {
              width: 100% !important;
              height: 118px !important;
              object-fit: contain !important;
            }
            .shop-panel .merch-card .product-image {
              object-fit: cover !important;
            }
            .shop-panel .product-body { padding: 7px !important; }
            .shop-panel .product-body h3 {
              min-height: 30px !important;
              font-size: 11.5px !important;
            }
            .shop-panel .product-detail,
            .shop-panel .text-link { font-size: 10px !important; }
            .shop-panel .product-links .button {
              min-height: 34px !important;
              padding: 5px !important;
              font-size: 10.5px !important;
            }
          }
          @media (max-width: 360px) {
            .shop-panel .book-grid,
            .shop-panel .merch-grid { gap: 6px !important; }
            .shop-panel .product-image { height: 105px !important; }
          }
        </style>`;
        if (html.indexOf('mobile-catalog-grid-style') === -1 && html.indexOf('</head>') !== -1) {
          html = html.replace('</head>', mobileCatalogStyle + '\n</head>');
        }

        var marker = '        <div class="book-grid">\n';
        var newPaperback = `          <article class="product-card book-card">
            <img class="product-image" src="https://images-na.ssl-images-amazon.com/images/P/B0HCMMZF89.01.L.jpg" alt="Furious Acid paperback book cover" loading="lazy">
            <div class="product-body">
              <h3>Furious Acid Paperback</h3>
              <p class="product-detail">Paperback edition</p>
              <div class="product-links">
                <a class="button" href="https://www.amazon.com/dp/B0HCMMZF89" target="_blank" rel="noopener noreferrer">View on Amazon ↗</a>
              </div>
            </div>
          </article>

`;
        var italianCard = `          <article class="product-card book-card">
            <img class="product-image" src="https://images-na.ssl-images-amazon.com/images/P/B0HC8H1LR4.01.L.jpg" alt="Sintesi di farmaci Italian edition book cover" loading="lazy">
            <div class="product-body">
              <h3>Sintesi di farmaci</h3>
              <p class="product-detail">Edizione italiana</p>
              <div class="product-links">
                <a class="button" href="https://www.amazon.it/dp/B0HC8H1LR4" target="_blank" rel="noopener noreferrer">Acquista su Amazon.it ↗</a>
              </div>
            </div>
          </article>

`;
        var extraCards = '';
        if (html.indexOf('B0HCMMZF89') === -1) extraCards += newPaperback;
        if (html.indexOf('B0HC8H1LR4') === -1) extraCards += italianCard;
        if (extraCards && html.indexOf(marker) !== -1) {
          html = html.replace(marker, marker + extraCards);
        }

        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        document.body.innerHTML = '<p>Furious Acid is temporarily unavailable. Please refresh.</p>';
      });
  </script>
</body>
</html>
