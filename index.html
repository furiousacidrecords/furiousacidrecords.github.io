<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Furious Acid</title>
  <style>html,body{margin:0;background:#f3f2f5;font-family:system-ui,sans-serif}p{padding:24px;text-align:center}</style>
</head>
<body>
  <p>Loading Furious Acid…</p>
  <script>
    fetch('home-original.html?v=20260801', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('Homepage unavailable');
        return response.text();
      })
      .then(function (html) {
        html = html.replace(/<iframe\b[^>]*class=["'][^"']*\bpurple-progress-frame\b[^"']*["'][\s\S]*?<\/iframe>/i, '');
        html = html.replace(/<a\b[^>]*class=["'][^"']*\blab-simulator-cta\b[^"']*["'][^>]*>[\s\S]*?<\/a>/i, '');

        var marker = '        <div class="book-grid">\n';
        var card = `          <article class="product-card book-card">
            <img class="product-image" src="https://images-na.ssl-images-amazon.com/images/P/B0HC8H1LR4.01.L.jpg" alt="Sintesi di farmaci Italian edition book cover" loading="lazy">
            <div class="product-body">
              <h3>Sintesi di farmaci</h3>
              <p class="product-detail">Edizione italiana</p>
              <div class="product-links">
                <a class="button" href="https://www.amazon.it/dp/B0HC8H1LR4" target="_blank" rel="noopener noreferrer">Acquista su Amazon.it ↗</a>
              </div>
            </div>
          </article>

`;
        if (html.indexOf('B0HC8H1LR4') === -1 && html.indexOf(marker) !== -1) {
          html = html.replace(marker, marker + card);
        }

        var simulatorLink = '<a href="/purple/" class="update-cta">Open the simulator</a>';
        var manualLink = `
    <a href="/purple/manual/" class="update-manual-link">Purple Rabbit Chemistry Simulation Manual</a>`;
        var manualStyle = `<style id="purple-manual-link-style">
          .update-strip .update-manual-link {
            display: block;
            width: fit-content;
            max-width: 100%;
            margin: 10px auto 0;
            color: #6f00ff;
            font-size: .72rem;
            font-weight: 900;
            letter-spacing: .045em;
            line-height: 1.35;
            text-align: center;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
          }
          .update-strip .update-manual-link:hover,
          .update-strip .update-manual-link:focus-visible {
            color: #45108f;
          }
        </style>`;
        if (html.indexOf('/purple/manual/') === -1 && html.indexOf(simulatorLink) !== -1) {
          html = html.replace(simulatorLink, simulatorLink + manualLink);
        }
        if (html.indexOf('purple-manual-link-style') === -1 && html.indexOf('</head>') !== -1) {
          html = html.replace('</head>', manualStyle + '\n</head>');
        }

        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        document.body.innerHTML = '<p>Furious Acid is temporarily unavailable. Please refresh.</p>';
      });
  </script>
</body>
</html>
